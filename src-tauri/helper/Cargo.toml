[package]
name = "veil-helper"
version = "0.1.0"
description = "Privileged TUN helper for Veil"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "veil-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
