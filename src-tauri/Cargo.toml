[package]
name = "veil"
version = "0.1.0"
description = "Veil - Linux desktop proxy client powered by sing-box"
authors = ["Veil"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "veil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embed the built frontend instead of loading build.devUrl. Enabled by default
# so a plain `cargo build --release` produces a standalone binary; use
# `cargo build --no-default-features` for a Tauri dev-server build.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
regex = "1"
libc = "0.2"
notify-rust = "4"
ksni = "0.3"
futures-util = "0.3"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
